[package]
name = "mass-spectrometry-counts"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Compute bucket counts and co-occurrence matrices from mass spectra"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.18.4"
rustc-hash = "2"
hdf5 = { package = "hdf5-metno", version = "0.12" }
ndarray = "0.17.2"
reqwest = { version = "0.13.2", features = ["blocking"] }
npyz = { version = "0.8", features = ["npz"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
